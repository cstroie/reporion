<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Reporion</title>
  <desc id="desc">A radiology report in a folder, with a chest X-ray and magnifying glass.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07366d"/><stop offset="1" stop-color="#061e49"/></linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1688ed"/><stop offset="1" stop-color="#0755a5"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8f1fb"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6f5ff"/><stop offset="1" stop-color="#9acdf6"/></linearGradient>
    <clipPath id="xrayClip"><rect x="192" y="117" width="184" height="143" rx="10"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="94" fill="url(#bg)"/>
  <!-- folder and stored reports -->
  <path d="M68 183a19 19 0 0 1 19-19h78l24 24h90a19 19 0 0 1 19 19v193a20 20 0 0 1-20 20H91a23 23 0 0 1-23-23z" fill="#eaf5ff"/>
  <path d="M58 207a18 18 0 0 1 18-18h78l23 23h103a18 18 0 0 1 18 18v168a20 20 0 0 1-20 20H82a24 24 0 0 1-24-24z" fill="#1880df"/>
  <path d="M47 238a18 18 0 0 1 18-18h75l22 22h109a18 18 0 0 1 18 18v145a20 20 0 0 1-20 20H75a24 24 0 0 1-24-24z" fill="#f5faff"/>
  <path d="M42 262a18 18 0 0 1 18-18h73l22 22h113a18 18 0 0 1 18 18v123a20 20 0 0 1-20 20H68a24 24 0 0 1-24-24z" fill="url(#folder)"/>
  <path d="M48 256 177 291h111v120H76a24 24 0 0 1-24-19z" fill="#1269bf" opacity=".9"/>
  <!-- report page -->
  <path d="M175 72h174l52 52v282a19 19 0 0 1-19 19H175a19 19 0 0 1-19-19V91a19 19 0 0 1 19-19z" fill="#052d5d" opacity=".6"/>
  <path d="M177 65h174l52 52v282a19 19 0 0 1-19 19H177a19 19 0 0 1-19-19V84a19 19 0 0 1 19-19z" fill="url(#paper)"/>
  <path d="M351 65v37a15 15 0 0 0 15 15h37z" fill="#a6d1fa"/>
  <!-- chest X-ray panel -->
  <rect x="192" y="117" width="184" height="143" rx="10" fill="#062a54"/>
  <g clip-path="url(#xrayClip)" fill="none" stroke="#a8d6ff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M284 133v107" stroke-width="9"/>
    <path d="M279 144c-20-21-34-19-48-6-11 10-14 25-26 30-9 4-16 3-21 13 17-2 31 4 37 15 8 15 6 38 17 53 8 11 20 15 31 12" stroke-width="8"/>
    <path d="M289 144c20-21 34-19 48-6 11 10 14 25 26 30 9 4 16 3 21 13-17-2-31 4-37 15-8 15-6 38-17 53-8 11-20 15-31 12" stroke-width="8"/>
    <path d="M239 151q24-5 42 7M222 168q29-5 60 9M216 187q28-4 66 10M215 207q27-2 67 12M226 229q22-2 56 7M329 151q-24-5-42 7M346 168q-29-5-60 9M352 187q-28-4-66 10M353 207q-27-2-67 12M342 229q-22-2-56 7" stroke-width="6"/>
  </g>
  <!-- report lines -->
  <g fill="#7b9cbd"><rect x="192" y="274" width="151" height="10" rx="5"/><rect x="192" y="297" width="134" height="10" rx="5"/><rect x="192" y="320" width="116" height="10" rx="5"/><rect x="192" y="343" width="95" height="10" rx="5"/></g>
  <path d="m204 390 21-22c4-4 8-3 6 3l-7 14 17-11c5-3 8-1 7 4l-2 7 13-7c4-2 7 0 8 4l2 4h25" fill="none" stroke="#0b3769" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
