  <path d="M402 399 447 444a15 15 0 0 1-21 21l-45-45" fill="#0877d8" stroke="#0a376c" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="359" cy="352" r="54" fill="#0b376c" stroke="#092b57" stroke-width="5"/>
  <circle cx="359" cy="352" r="42" fill="url(#lens)"/>
  <path d="M329 348a32 32 0 0 1 28-28" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
