  <circle cx="355" cy="347" r="47" fill="#08284d" stroke="#167bd0" stroke-width="5"/>
  <circle cx="355" cy="347" r="34" fill="url(#glass)"/>
  <path d="M380 382l44 45a12 12 0 0 1-17 17l-45-45" fill="#0c477e" stroke="#167bd0" stroke-width="5" stroke-linejoin="round"/>
  <path d="M338 327a23 23 0 0 1 15-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
