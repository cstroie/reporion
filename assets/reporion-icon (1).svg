  <rect x="183" y="119" width="150" height="126" rx="10" fill="#0b2b50"/>
  <g fill="none" stroke="#9bcfff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 143v78M258 151c-12-18-27-23-40-16-13 8-18 25-19 43-1 18 7 37 20 48M258 151c12-18 27-23 40-16 13 8 18 25 19 43 1 18-7 37-20 48"/>
    <path d="M257 166c-16-5-29-3-43 5M257 181c-17-4-32 0-45 8M257 196c-17-2-30 3-40 11M259 166c16-5 29-3 43 5M259 181c17-4 32 0 45 8M259 196c17-2 30 3 40 11"/>
    <path d="M221 145c-8-8-17-9-24-3M295 145c8-8 17-9 24-3"/>
  </g>
