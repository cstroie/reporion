<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Reporion</title>
  <desc id="desc">Radiology report folder with chest X-ray and magnifying glass.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123f70"/><stop offset="1" stop-color="#061d3c"/></linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2196f3"/><stop offset="1" stop-color="#0756a6"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5f4ff"/><stop offset="1" stop-color="#91cfff"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="86" fill="url(#bg)"/>
  <!-- stacked report folder -->
  <path d="M82 170a20 20 0 0 1 20-20h92l27 29h126a20 20 0 0 1 20 20v205a22 22 0 0 1-22 22H104a22 22 0 0 1-22-22z" fill="#eaf5ff" opacity=".98"/>
