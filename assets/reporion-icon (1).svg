  <g fill="#7898b8">
    <rect x="183" y="263" width="174" height="9" rx="4.5"/>
    <rect x="183" y="284" width="156" height="9" rx="4.5"/>
    <rect x="183" y="305" width="165" height="9" rx="4.5"/>
    <rect x="183" y="326" width="112" height="9" rx="4.5"/>
  </g>
  <path d="M194 370l21-22 7 13 15-9 8 12 24 0" fill="none" stroke="#123f70" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
