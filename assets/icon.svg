<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Reporion: a calligraphic capital R with swashes, silver on black, in a thin double frame -->
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="0.45" stop-color="#b9bdc4"/>
      <stop offset="0.7" stop-color="#e3e5e9"/>
      <stop offset="1" stop-color="#8e939b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0b0c0e"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="8.5" fill="none" stroke="url(#silver)" stroke-width="1.4"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="6" fill="none" stroke="#9aa0a8" stroke-opacity=".55" stroke-width=".6"/>
  <g fill="url(#silver)" stroke="url(#silver)" stroke-width=".8" stroke-linejoin="round">
    <!-- the stem: a broad-nib downstroke, swelling then tapering into a curl at the foot -->
    <path d="M27.2 15.2c1.6-.4 2.6.4 2.5 2.2L28 42.5c-.3 4.6-2.9 8.2-7.4 8.4-3.3.2-5.6-1.6-5.4-4 .2-1.9 2-2.9 3.6-2.2-1.2.2-2 1-1.9 2.1.1 1.6 1.8 2.6 3.8 2.3 2.8-.4 4.3-2.8 4.5-6.4l1.7-26c.1-1.2.1-1.6.3-1.5Z"/>
    <!-- the entry swash: a hairline loop from the left, over the top, into the bowl -->
    <path d="M12.6 24.6c-1.8-4.2.3-9.3 6.1-11.6 5.2-2 11.2-1.9 16.6-1.5 7.2.5 11.8 4 11.8 9.4 0 5.6-4.7 9.7-12 10.6l-.2-1.3c5.5-1 8.7-4.3 8.7-9 0-4.4-3.4-7.3-9-7.8-5.3-.5-10.6-.4-15.2 1.2-4.9 1.8-7 5.6-5.8 9.6Z"/>
    <!-- the bowl's weight on its right side -->
    <path d="M38.5 13.4c4.7 1.3 7.4 4.3 7.4 8.1 0 4.2-3 7.4-7.9 8.9 3-1.8 4.6-4.9 4.6-8.4 0-3.8-1.4-6.8-4.1-8.6Z"/>
    <!-- waist hairline and the leg: a swelling diagonal that sweeps out into a long tail -->
    <path d="M28.6 31.3c1.9-.6 4-.7 5.7-.1l9 13.4c1.4 2.1 3 3.3 4.9 3.3 2.2 0 3.8-1.4 4.4-3.6l1 .3c-.6 3.2-3 5.4-6.2 5.4-3 0-5.1-1.6-6.8-4.3l-8.3-13.2c-1.2-.2-2.5-.2-3.7.1Z"/>
  </g>
</svg>
